<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John's Burgers – Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Libre+Caslon+Text:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; background: #fff; color: #000; font-variant-numeric: tabular-nums; font-feature-settings: "zero" 0, "tnum" 1; }
  header { background: #000; color: #fff; }
  .bar { max-width: 760px; margin: 0 auto; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brandwrap { display: flex; align-items: center; gap: 14px; }
  .logo { width: 58px; height: 58px; object-fit: contain; filter: invert(1); }
  .brand { margin: 0; font-family: "Libre Caslon Text", Georgia, serif; font-weight: 700; font-size: 1.6rem; letter-spacing: .02em; text-transform: uppercase; }
  .brand span { display: block; margin-top: 4px; font-family: "Archivo", sans-serif; font-weight: 400; font-size: .8rem; letter-spacing: 0; text-transform: none; color: #bbb; }
  .rule { height: 3px; background: #000; margin-top: 5px; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  input { width: 100%; font-family: inherit; font-size: 1.05rem; padding: 12px 14px; margin-bottom: 10px; border: 1px solid #000; border-radius: 0; background: #fff; color: #000; }
  input:focus { outline: 2px solid #000; outline-offset: 2px; }
  button { font-family: inherit; font-size: .95rem; font-weight: 600; padding: 12px 20px; border: 1px solid #000; border-radius: 0; background: #000; color: #fff; cursor: pointer; }
  button:hover:not(:disabled) { background: #fff; color: #000; }
  button:disabled { background: #fff; color: #bbb; border-color: #ddd; cursor: default; }
  button.link { background: none; border: 0; padding: 0; color: #fff; font-size: .9rem; font-weight: 500; }
  button.link:hover:not(:disabled) { background: none; color: #bbb; }
  .nav { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 0 28px; border-bottom: 1px solid #d6d6d6; margin-bottom: 18px; }
  .tabs, .seg { display: flex; gap: 26px; }
  .nav button, .nav button:hover:not(:disabled) { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; padding: 10px 0 8px; color: #6b6b6b; font-weight: 500; }
  .nav button:hover:not(:disabled) { color: #000; }
  .nav button.active, .nav button.active:hover:not(:disabled) { color: #000; border-bottom-color: #000; }
  .tab { font-size: 1.1rem; }
  .seg { gap: 18px; }
  .seg button { font-size: .9rem; }
  .card { border: 1px solid #000; padding: 14px 16px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 16px; }
  .who { min-width: 0; }
  .who b { font-family: "Libre Caslon Text", Georgia, serif; font-size: 1.2rem; font-weight: 700; }
  .who div { color: #6b6b6b; font-size: .85rem; overflow-wrap: anywhere; }
  .who .meta span + span { margin-left: 14px; }
  .stats { display: flex; text-align: center; }
  .stats div { width: 78px; font-size: .78rem; color: #6b6b6b; }
  .stats b { display: block; font-size: 1.4rem; font-weight: 600; color: #000; }
  .ready b { color: #16a34a; }
  .card button { width: 140px; }
  .muted { color: #6b6b6b; font-size: .9rem; }
  .period { margin: 0; font-size: .85rem; color: #6b6b6b; }
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin: 26px 0 8px; }
  .kpi { padding: 2px 14px; }
  .kpi:first-child { padding-left: 0; }
  .kpi + .kpi { border-left: 1px solid #d6d6d6; }
  .kpi b { display: block; font-family: "Libre Caslon Text", Georgia, serif; font-size: 2.1rem; font-weight: 400; line-height: 1.15; }
  .kpi span { display: block; font-size: .8rem; color: #6b6b6b; }
  .sec { margin: 44px 0 12px; font-family: "Libre Caslon Text", Georgia, serif; font-size: 1.35rem; font-weight: 400; }
  .brow { display: grid; grid-template-columns: 64px 1fr 44px; gap: 10px; align-items: center; margin: 5px 0; font-size: .85rem; }
  .brow b { text-align: right; font-weight: 600; }
  .track { display: flex; height: 12px; background: #f2f2f2; }
  .fill { background: #000; height: 100%; }
  .fill.new { background: #9a9a9a; }
  .legend { font-size: .82rem; color: #6b6b6b; margin-bottom: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin: 0 4px 0 12px; background: #000; vertical-align: -1px; }
  .legend i.new { background: #9a9a9a; }
  .legend i:first-child { margin-left: 0; }
  .trow { display: grid; grid-template-columns: 28px 1fr 64px 64px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #e3e3e3; }
  .trow .rank { color: #6b6b6b; }
  .trow .who b { font-size: 1.05rem; }
  .num { text-align: center; font-size: .75rem; color: #6b6b6b; }
  .num b { display: block; font-size: 1.15rem; font-weight: 600; color: #000; }
  .qrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e3e3e3; font-size: .9rem; }
  .qrow small { display: block; color: #6b6b6b; }
  .qrow b { font-weight: 600; }
  #map { height: 380px; border: 1px solid #000; background: #f2f2f2; }
  #map .leaflet-tile-pane { filter: grayscale(1) contrast(1.05); }
  #map .leaflet-control-zoom a { border-radius: 0; color: #000; }
  .radius { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 6px 0 10px; }
  .radius div { padding: 2px 14px; font-size: .8rem; color: #6b6b6b; }
  .radius div:first-child { padding-left: 0; }
  .radius div + div { border-left: 1px solid #d6d6d6; }
  .radius b { display: block; font-family: "Libre Caslon Text", Georgia, serif; font-size: 1.7rem; font-weight: 400; color: #000; }
  .credit { font-size: .75rem; color: #6b6b6b; }
  .liberty { display: block; width: 100%; max-width: 420px; margin: 24px auto 0; mix-blend-mode: multiply; opacity: .85; }
  @media (max-width: 700px) {
    .card { grid-template-columns: 1fr; }
    .stats { justify-content: space-between; }
    .stats div { width: auto; flex: 1; }
    .card button { width: 100%; }
    #map { height: 300px; }
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 18px; }
    .kpi:nth-child(3n+1) { border-left: 0; padding-left: 0; }
  }
  @media (max-width: 420px) {
    .logo { width: 44px; height: 44px; }
    .brand { font-size: 1.25rem; }
    .trow { grid-template-columns: 22px 1fr 52px 52px; gap: 6px; }
    .kpi { padding: 2px 10px; }
    .kpi b { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brandwrap">
      <img class="logo" src="logo-black.png" alt="" onerror="this.style.display='none'">
      <h1 class="brand">John's Burgers<span>Teambereich für Treuepunkte</span></h1>
    </div>
    <button class="link" id="logout" hidden>Abmelden</button>
  </div>
</header>
<div class="rule"></div>
<main>
  <div id="view"></div>
</main>
<img class="liberty" src="liberty.png" alt="" onerror="this.style.display='none'">
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient("https://zhqxjdlqxgjzqamququu.supabase.co", "sb_publishable_N-bZcHBzjBJVY2PXoq2j8Q_g6RHuI3N");
const view = document.getElementById("view");
const logout = document.getElementById("logout");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const fmt = (iso) => (iso ? new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }) : "–");
const punkte = (n) => `${n} ${n === 1 ? "Punkt" : "Punkte"}`;
const gaeste = (n) => `${n} ${n === 1 ? "Gast" : "Gäste"}`;
const WEEKDAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const SHOP = [54.3303, 10.1268];
const RINGS_KM = [2, 5, 10];

let settings = { reward_cost: 10 };
let timer;
let seq = 0;
let statSeq = 0;
let tab = "kunden";
let days = 30;
let map = null;
let plzTable = null;

function showLogin(msg = "") {
  logout.hidden = true;
  view.innerHTML = `
    <input id="email" type="email" autocomplete="username" placeholder="E-Mail">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort">
    <button id="login">Anmelden</button><p class="muted">${msg}</p>`;
  document.getElementById("login").onclick = async () => {
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("pw").value,
    });
    error ? showLogin("Anmeldung fehlgeschlagen.") : showApp();
  };
}

async function showApp() {
  logout.hidden = false;
  const { data } = await supabase.from("settings").select("*").eq("id", 1).maybeSingle();
  if (data) settings = data;
  view.innerHTML = `
    <div class="nav">
      <div class="tabs">
        <button class="tab" id="t-kunden">Kunden</button>
        <button class="tab" id="t-stats">Statistik</button>
      </div>
      <div class="seg" id="seg"></div>
    </div>
    <div id="tabview"></div>`;
  document.getElementById("t-kunden").onclick = () => openTab("kunden");
  document.getElementById("t-stats").onclick = () => openTab("stats");
  openTab(tab);
}

function openTab(t) {
  tab = t;
  document.getElementById("t-kunden").classList.toggle("active", t === "kunden");
  document.getElementById("t-stats").classList.toggle("active", t === "stats");
  if (map) { map.remove(); map = null; }
  t === "kunden" ? showSearch() : showStats();
}

function showSearch() {
  document.getElementById("seg").innerHTML = "";
  const tv = document.getElementById("tabview");
  tv.innerHTML = `<input id="q" type="search" placeholder="Name oder E-Mail suchen"><div id="list"></div>`;
  document.getElementById("q").oninput = (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => search(e.target.value.trim()), 250);
  };
  search("");
}

async function search(q) {
  const n = ++seq;
  const { data, error } = await supabase.rpc("staff_search", { q });
  if (n !== seq) return;
  const list = document.getElementById("list");
  if (!list) return;
  if (error) return (list.innerHTML = `<p class="muted">Kein Zugriff: ${esc(error.message)}</p>`);
  if (!data.length) return (list.innerHTML = `<p class="muted">Niemand gefunden.</p>`);
  list.innerHTML = data.map(card).join("");
  data.forEach((c) => (document.getElementById("r-" + c.id).onclick = () => redeem(c)));
}

function card(c) {
  const available = Math.floor(c.points / settings.reward_cost);
  return `<div class="card">
    <div class="who"><b>${esc(c.name) || "(kein Name)"}</b><div>${esc(c.email)}</div><div class="meta">${c.postcode ? `<span>PLZ ${esc(c.postcode)}</span>` : ""}<span>zuletzt ${fmt(c.last_claim_at)}</span></div></div>
    <div class="stats">
      <div><b>${c.visits}</b>Besuche</div>
      <div><b>${c.redemptions}</b>eingelöst</div>
      <div><b>${c.points}</b>Guthaben</div>
      <div class="ready"><b>${available}</b>einlösbar</div>
    </div>
    <button id="r-${c.id}" ${available ? "" : "disabled"}>Einlösen</button>
  </div>`;
}

async function redeem(c) {
  if (!confirm(`${punkte(settings.reward_cost)} von ${c.name || c.email} einlösen?`)) return;
  const { data, error } = await supabase.rpc("redeem_reward", { p_customer_id: c.id });
  if (error || !data.ok) alert("Einlösen fehlgeschlagen: " + (error?.message || data.reason));
  search(document.getElementById("q")?.value.trim() ?? "");
}

function showStats() {
  const seg = document.getElementById("seg");
  seg.innerHTML = [7, 30, 90].map((d) => `<button data-d="${d}" class="${d === days ? "active" : ""}">${d} Tage</button>`).join("");
  seg.querySelectorAll("button").forEach((b) => (b.onclick = () => { days = Number(b.dataset.d); showStats(); }));
  const tv = document.getElementById("tabview");
  tv.innerHTML = `
    <p class="period">Alle Zahlen beziehen sich auf die letzten ${days} Tage, außer „heute“ und „Kunden gesamt“.</p>
    <div id="statbox"><p class="muted">Lade …</p></div>`;
  loadStats();
}

async function getPlz() {
  if (plzTable) return plzTable;
  try {
    const r = await fetch("plz.json");
    if (!r.ok) throw new Error(r.status);
    plzTable = await r.json();
  } catch {
    return null;
  }
  return plzTable;
}

async function loadStats() {
  const n = ++statSeq;
  const [stats, pcs, plz] = await Promise.all([
    supabase.rpc("staff_stats", { p_days: days }),
    supabase.rpc("staff_postcodes", { p_days: days }),
    getPlz(),
  ]);
  if (n !== statSeq) return;
  const box = document.getElementById("statbox");
  if (!box) return;
  if (stats.error) return (box.innerHTML = `<p class="muted">Kein Zugriff: ${esc(stats.error.message)}</p>`);
  if (map) { map.remove(); map = null; }
  box.innerHTML = renderStats(stats.data);
  drawMap(pcs.error ? null : pcs.data.postcodes, plz);
}

const kpi = (n, label) => `<div class="kpi"><b>${n}</b><span>${label}</span></div>`;

function bars(rows) {
  const max = Math.max(0, ...rows.map((r) => r.n));
  return rows.map((r) => `
    <div class="brow"><span>${esc(r.label)}</span>
      <div class="track"><div class="fill" style="width:${max ? (r.n / max) * 100 : 0}%"></div></div>
      <b>${r.n}</b></div>`).join("");
}

function renderStats(s) {
  const k = s.kpis;
  let html = `<div class="kpis">
    ${kpi(k.visits_today, "Besuche heute")}
    ${kpi(k.visits_period, "Besuche")}
    ${kpi(k.unique_guests, "Gäste")}
    ${kpi(k.new_guests, "Neue Gäste")}
    ${kpi(k.redemptions, "Einlösungen")}
    ${kpi(k.total_customers, "Kunden gesamt")}
  </div>`;

  html += `<h2 class="sec">Top 20 Gäste</h2>`;
  html += s.top_guests.length
    ? s.top_guests.map((g, i) => `
      <div class="trow">
        <span class="rank">${i + 1}</span>
        <div class="who"><b>${esc(g.name) || "(kein Name)"}</b><div class="meta"><span>${esc(g.email)}</span><span>zuletzt ${fmt(g.last_visit)}</span></div></div>
        <div class="num"><b>${g.visits_period}</b>im Zeitraum</div>
        <div class="num"><b>${g.visits_total}</b>insgesamt</div>
      </div>`).join("")
    : `<p class="muted">Noch keine Besuche in diesem Zeitraum.</p>`;

  html += `<h2 class="sec">Uhrzeiten</h2>`;
  const hrs = s.by_hour;
  const a = hrs.findIndex((x) => x.n > 0);
  const b = hrs.findLastIndex((x) => x.n > 0);
  html += a === -1
    ? `<p class="muted">Noch keine Daten.</p>`
    : bars(hrs.slice(a, b + 1).map((x) => ({ label: `${x.hour} Uhr`, n: x.n })));

  html += `<h2 class="sec">Wochentage</h2>`;
  html += bars(s.by_weekday.map((x) => ({ label: WEEKDAYS[x.dow - 1], n: x.n })));

  html += `<h2 class="sec">Neu und wiederkehrend, letzte 12 Wochen</h2>
    <div class="legend"><i></i>wiederkehrend<i class="new"></i>neu</div>`;
  const wmax = Math.max(0, ...s.weekly.map((w) => w.new + w.returning));
  html += s.weekly.map((w) => {
    const label = new Date(w.week_start).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
    const pct = (n) => (wmax ? (n / wmax) * 100 : 0);
    return `<div class="brow"><span>${label}</span>
      <div class="track"><div class="fill" style="width:${pct(w.returning)}%"></div><div class="fill new" style="width:${pct(w.new)}%"></div></div>
      <b>${w.new + w.returning}</b></div>`;
  }).join("");

  html += `<h2 class="sec">Wo unsere Gäste wohnen</h2>
    <div id="mapinfo"><p class="muted">Lade Karte …</p></div>
    <div id="map"></div>
    <p class="credit">Jeder Kreis ist eine Postleitzahl, je größer, desto mehr Gäste. Ringe bei ${RINGS_KM.join(", ")} km. Karte © OpenStreetMap-Mitwirkende, PLZ-Koordinaten von GeoNames (CC BY 4.0).</p>`;

  html += `<h2 class="sec">Häufigste Postleitzahlen</h2>`;
  html += s.postcodes.length
    ? bars(s.postcodes.map((x) => ({ label: x.postcode, n: x.n })))
    : `<p class="muted">Noch keine Daten.</p>`;

  const q = s.quality;
  html += `<h2 class="sec">Datenqualität</h2>
    <div class="qrow"><div>Sperrzeit-Treffer<small>Erneuter Tap innerhalb der Sperrzeit, kein Punkt vergeben</small></div><b>${q.cooldown_hits}</b></div>
    <div class="qrow"><div>Seite neu geladen<small>Gleicher Link erneut geöffnet, harmlos</small></div><b>${q.reloads}</b></div>
    <div class="qrow"><div>PLZ fehlt oder ungültig<small>Alle Kunden</small></div><b>${q.bad_postcodes}</b></div>`;

  html += `<p class="muted" style="margin-top:24px">Stand ${new Date(s.generated_at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr, alle Zeiten in Kieler Ortszeit.</p>`;
  return html;
}

function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function drawMap(postcodes, plz) {
  const info = document.getElementById("mapinfo");
  const el = document.getElementById("map");
  if (!info || !el) return;
  if (!window.L) { info.innerHTML = `<p class="muted">Kartenbibliothek nicht geladen.</p>`; el.remove(); return; }
  if (!postcodes) { info.innerHTML = `<p class="muted">PLZ-Daten nicht verfügbar.</p>`; el.remove(); return; }
  if (!plz) { info.innerHTML = `<p class="muted">plz.json nicht gefunden.</p>`; el.remove(); return; }

  const pts = [];
  let unknown = 0;
  for (const x of postcodes) {
    const c = plz[x.plz];
    if (c) pts.push({ plz: x.plz, n: x.guests, ll: c, d: km(SHOP, c) });
    else unknown += x.guests;
  }
  const total = pts.reduce((s, p) => s + p.n, 0);
  const share = (r) => (total ? Math.round((100 * pts.filter((p) => p.d <= r).reduce((s, p) => s + p.n, 0)) / total) : 0);

  info.innerHTML = total
    ? `<div class="radius">${RINGS_KM.map((r) => `<div><b>${share(r)} %</b>wohnen bis ${r} km entfernt</div>`).join("")}</div>
       <p class="muted">Grundlage: ${gaeste(total)} mit Postleitzahl${unknown ? `, dazu ${gaeste(unknown)} mit unbekannter PLZ` : ""}.</p>`
    : `<p class="muted">Noch keine Gäste mit Postleitzahl in diesem Zeitraum.</p>`;

  map = L.map(el, { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "© OpenStreetMap",
  }).addTo(map);

  for (const r of RINGS_KM) {
    L.circle(SHOP, { radius: r * 1000, color: "#000", weight: 1, opacity: 0.5, dashArray: "4 6", fill: false, interactive: false }).addTo(map);
  }

  const max = Math.max(1, ...pts.map((p) => p.n));
  for (const p of pts) {
    L.circleMarker(p.ll, { radius: 6 + 16 * Math.sqrt(p.n / max), color: "#000", weight: 1, fillColor: "#000", fillOpacity: 0.55 })
      .bindTooltip(`PLZ ${esc(p.plz)}: ${gaeste(p.n)}, ${p.d.toFixed(1).replace(".", ",")} km entfernt`)
      .addTo(map);
  }

  L.circleMarker(SHOP, { radius: 7, color: "#000", weight: 3, fillColor: "#fff", fillOpacity: 1 })
    .bindTooltip("John's Burgers")
    .addTo(map);

  map.fitBounds(L.latLng(SHOP).toBounds(2 * 1000 * Math.max(...RINGS_KM)));
}

logout.onclick = async () => { await supabase.auth.signOut(); showLogin(); };

const { data: { session } } = await supabase.auth.getSession();
session ? showApp() : showLogin();
</script>
</body>
</html>
