<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John's Burgers – Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400&family=Libre+Caslon+Text:wght@400&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --grey: #6b6b6b; --soft: #a3a3a3; --line: #e6e6e6; --track: #efefef; --go: #15803d; --serif: "Libre Caslon Text", Georgia, serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 16px; line-height: 1.4; background: #fff; color: #000; font-variant-numeric: tabular-nums; font-feature-settings: "zero" 0, "tnum" 1; }
  b, strong, h1, h2, h3 { font-weight: 400; }
  header { background: #000; color: #fff; }
  .bar { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brandwrap { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 44px; height: 44px; object-fit: contain; filter: invert(1); }
  .brand { margin: 0; font-family: var(--serif); font-size: 1.25rem; letter-spacing: .04em; text-transform: uppercase; }
  .brand span { display: block; margin-top: 2px; font-family: "Archivo", sans-serif; font-size: .8rem; letter-spacing: 0; text-transform: none; color: var(--soft); }
  .rule { height: 3px; background: #000; margin-top: 4px; }
  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 32px; }
  button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; padding: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
  .btn { display: block; width: 100%; padding: 14px 16px; background: #000; color: #fff; border: 1px solid #000; text-align: center; }
  .btn:active { background: #fff; color: #000; }
  .link { color: #fff; font-size: .9rem; }
  .link:active { color: var(--soft); }
  input { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; margin: 16px 0 4px; border: 1px solid #cfcfcf; border-radius: 0; background: #fff; color: #000; -webkit-appearance: none; appearance: none; }
  input:focus { outline: none; border-color: #000; }
  .login input { margin: 16px 0 0; }
  .login .btn { margin-top: 16px; }
  .muted { color: var(--grey); font-size: .9rem; }
  .tabs, .switch { display: flex; border-bottom: 1px solid var(--line); }
  .tabs { gap: 28px; }
  .switch { gap: 22px; margin-top: 24px; }
  .tabs button, .switch button { padding: 14px 0 10px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--grey); }
  .switch button { font-size: .95rem; padding: 10px 0 8px; }
  .tabs button.on, .switch button.on { color: #000; border-bottom-color: #000; }
  .item { border-bottom: 1px solid var(--line); }
  .head { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 0; }
  .grow { display: block; flex: 1; min-width: 0; }
  .chev { width: 14px; height: 14px; flex: none; color: var(--soft); transition: transform .15s; }
  .item.open > .head .chev { transform: rotate(90deg); }
  .name { display: block; font-family: var(--serif); font-size: 19px; line-height: 1.25; overflow-wrap: anywhere; }
  .status { display: block; margin-top: 3px; font-size: .9rem; color: var(--grey); }
  .status.go { color: var(--go); }
  .stamps { display: flex; gap: 3px; max-width: 240px; margin-top: 10px; }
  .stamps i { flex: 1; height: 4px; background: var(--track); }
  .stamps i.f { background: #000; }
  .detail { padding: 0 0 18px; }
  .detail .btn { margin-top: 14px; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); font-size: .95rem; }
  .kv span:first-child { color: var(--grey); flex: none; }
  .kv span:last-child { text-align: right; overflow-wrap: anywhere; min-width: 0; }
  .hero { padding: 24px 0 0; }
  .hero .lab { color: var(--grey); font-size: .95rem; }
  .hero .big { font-family: var(--serif); font-size: 56px; line-height: 1.1; margin-right: 8px; }
  .hero .unit { color: var(--grey); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row small { display: block; color: var(--grey); font-size: .85rem; margin-top: 2px; }
  .row .n { font-family: var(--serif); font-size: 22px; }
  .row.sm .n { font-size: 18px; }
  .body .row:last-child { border-bottom: 0; }
  .secs { margin-top: 28px; border-top: 1px solid var(--line); }
  .title { display: block; font-family: var(--serif); font-size: 18px; }
  .sum { display: block; margin-top: 3px; font-size: .9rem; color: var(--grey); }
  .body { padding: 0 0 20px; }
  .sub { color: var(--grey); font-size: .85rem; margin: 14px 0 6px; }
  .brow { display: grid; grid-template-columns: 52px 1fr 40px; gap: 10px; align-items: center; padding: 4px 0; font-size: .85rem; }
  .brow > span:first-child { color: var(--grey); }
  .brow > span:last-child { text-align: right; }
  .track { display: flex; height: 6px; background: var(--track); }
  .fill { display: block; height: 100%; background: #000; }
  .fill.nw { background: var(--soft); }
  .legend { display: flex; gap: 16px; font-size: .85rem; color: var(--grey); margin: 14px 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 6px; background: #000; margin-right: 6px; vertical-align: 2px; }
  .legend i.nw { background: var(--soft); }
  .lrow { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .lrow:last-child { border-bottom: 0; }
  .lrow .rk { color: var(--soft); font-size: .85rem; }
  .lrow .nm { font-family: var(--serif); font-size: 17px; overflow-wrap: anywhere; min-width: 0; }
  .note, .credit { font-size: .8rem; color: var(--grey); }
  .stand { margin-top: 24px; color: var(--grey); font-size: .85rem; }
  #map { height: 280px; margin-top: 14px; border: 1px solid #000; background: var(--track); }
  #map .leaflet-tile-pane { filter: grayscale(1) contrast(1.05); }
  #map .leaflet-bar { border-radius: 0; box-shadow: none; border: 1px solid #000; }
  #map .leaflet-bar a { border-radius: 0; color: #000; }
  .leaflet-tooltip { border-radius: 0; box-shadow: none; border: 1px solid #000; font-family: inherit; }
  .liberty { display: block; width: 100%; max-width: 360px; margin: 24px auto 0; mix-blend-mode: multiply; opacity: .85; }
  @media (min-width: 700px) {
    #map { height: 360px; }
    .hero .big { font-size: 64px; }
    .logo { width: 52px; height: 52px; }
    .brand { font-size: 1.45rem; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brandwrap">
      <img class="logo" src="logo-black.png" alt="" onerror="this.style.display='none'">
      <h1 class="brand">John's Burgers<span>Teambereich für Treuepunkte</span></h1>
    </div>
    <button class="link" id="logout" hidden>Abmelden</button>
  </div>
</header>
<div class="rule"></div>
<main>
  <div id="view"></div>
</main>
<img class="liberty" src="liberty.png" alt="" onerror="this.style.display='none'">
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient("https://zhqxjdlqxgjzqamququu.supabase.co", "sb_publishable_N-bZcHBzjBJVY2PXoq2j8Q_g6RHuI3N");
const view = document.getElementById("view");
const logout = document.getElementById("logout");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const fmt = (iso) => (iso ? new Date(iso).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit" }) : "–");
const num = (n) => Number(n ?? 0).toLocaleString("de-DE");
const punkte = (n) => `${n} ${n === 1 ? "Punkt" : "Punkte"}`;
const gaeste = (n) => `${num(n)} ${n === 1 ? "Gast" : "Gäste"}`;
const besuche = (n) => `${num(n)} ${n === 1 ? "Besuch" : "Besuche"}`;
const WEEKDAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const WEEKDAYS_LONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const SHOP = [54.3303, 10.1268];
const RINGS_KM = [2, 5, 10];
const MIN_VISITS_FOR_PEAK = 50;
const CHEV = `<svg class="chev" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2.5 9.5 7 5 11.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`;

let settings = { reward_cost: 10 };
let timer;
let seq = 0;
let statSeq = 0;
let tab = "kunden";
let days = 30;
let map = null;
let plzTable = null;
let customers = new Map();
let openId = null;
let geo = null;
const openSecs = new Set();

const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
const row = (label, n, note = "", cls = "") => `<div class="row${cls ? " " + cls : ""}"><span>${label}${note ? `<small>${note}</small>` : ""}</span><span class="n">${num(n)}</span></div>`;

function dropMap() {
  if (map) { map.remove(); map = null; }
}

function showLogin(msg = "") {
  logout.hidden = true;
  view.innerHTML = `
    <div class="login">
      <input id="email" type="email" autocomplete="username" placeholder="E-Mail">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Passwort">
      <button class="btn" id="login">Anmelden</button>
      <p class="muted">${msg}</p>
    </div>`;
  document.getElementById("login").onclick = async () => {
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("pw").value,
    });
    error ? showLogin("Anmeldung fehlgeschlagen.") : showApp();
  };
}

async function showApp() {
  logout.hidden = false;
  const { data } = await supabase.from("settings").select("*").eq("id", 1).maybeSingle();
  if (data) settings = data;
  view.innerHTML = `
    <div class="tabs">
      <button id="t-kunden">Kunden</button>
      <button id="t-stats">Statistik</button>
    </div>
    <div id="tabview"></div>`;
  document.getElementById("t-kunden").onclick = () => openTab("kunden");
  document.getElementById("t-stats").onclick = () => openTab("stats");
  openTab(tab);
}

function openTab(t) {
  tab = t;
  document.getElementById("t-kunden").classList.toggle("on", t === "kunden");
  document.getElementById("t-stats").classList.toggle("on", t === "stats");
  dropMap();
  t === "kunden" ? showSearch() : showStats();
}

function showSearch() {
  const tv = document.getElementById("tabview");
  tv.innerHTML = `<input id="q" type="search" placeholder="Name oder E-Mail suchen" autocomplete="off"><div id="list"></div>`;
  document.getElementById("q").oninput = (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => search(e.target.value.trim()), 250);
  };
  document.getElementById("list").onclick = (e) => {
    const r = e.target.closest("[data-redeem]");
    if (r) return redeem(customers.get(r.dataset.redeem));
    const h = e.target.closest(".item > .head");
    if (!h) return;
    const id = h.parentElement.dataset.id;
    openId = openId === id ? null : id;
    applyOpen();
  };
  search("");
}

function applyOpen() {
  document.querySelectorAll("#list .item").forEach((el) => {
    const on = el.dataset.id === openId;
    el.classList.toggle("open", on);
    el.querySelector(".head").setAttribute("aria-expanded", String(on));
    el.querySelector(".detail").hidden = !on;
  });
}

async function search(q) {
  const n = ++seq;
  const { data, error } = await supabase.rpc("staff_search", { q });
  if (n !== seq) return;
  const list = document.getElementById("list");
  if (!list) return;
  if (error) return (list.innerHTML = `<p class="muted">Kein Zugriff: ${esc(error.message)}</p>`);
  if (!data.length) return (list.innerHTML = `<p class="muted">Niemand gefunden.</p>`);
  customers = new Map(data.map((c) => [String(c.id), c]));
  list.innerHTML = data.map(item).join("");
  applyOpen();
}

function item(c) {
  const cost = settings.reward_cost;
  const id = esc(String(c.id));
  const ready = c.points >= cost;
  const free = Math.floor(c.points / cost);
  const filled = ready ? cost : c.points % cost;
  const status = ready
    ? `<span class="status go">${free > 1 ? `${free} Gratis-Burger bereit` : "Gratis-Burger bereit"}</span>`
    : `<span class="status">${c.points % cost} von ${cost}</span>`;
  const stamps = Array.from({ length: cost }, (_, i) => `<i${i < filled ? ' class="f"' : ""}></i>`).join("");
  return `<div class="item" data-id="${id}">
    <button class="head" aria-expanded="false">
      <span class="grow"><span class="name">${esc(c.name) || "(kein Name)"}</span>${status}<span class="stamps">${stamps}</span></span>${CHEV}
    </button>
    <div class="detail" hidden>
      ${kv("E-Mail", esc(c.email) || "–")}
      ${kv("Besuche insgesamt", num(c.visits))}
      ${kv("Schon eingelöst", num(c.redemptions))}
      ${kv("Zuletzt da", fmt(c.last_claim_at))}
      ${kv("PLZ", c.postcode ? esc(c.postcode) : "–")}
      ${ready ? `<button class="btn" data-redeem="${id}">Burger einlösen</button>` : ""}
    </div>
  </div>`;
}

async function redeem(c) {
  if (!c) return;
  if (!confirm(`${punkte(settings.reward_cost)} von ${c.name || c.email} einlösen?`)) return;
  const { data, error } = await supabase.rpc("redeem_reward", { p_customer_id: c.id });
  if (error || !data.ok) alert("Einlösen fehlgeschlagen: " + (error?.message || data.reason));
  search(document.getElementById("q")?.value.trim() ?? "");
}

function showStats() {
  const tv = document.getElementById("tabview");
  tv.innerHTML = `<div id="statbox"><p class="muted">Lade …</p></div>`;
  document.getElementById("statbox").onclick = (e) => {
    const d = e.target.closest("[data-d]");
    if (d) {
      days = Number(d.dataset.d);
      document.querySelectorAll("[data-d]").forEach((b) => b.classList.toggle("on", Number(b.dataset.d) === days));
      loadStats();
      return;
    }
    const h = e.target.closest(".sec > .head");
    if (h) toggleSec(h.parentElement.dataset.sec);
  };
  loadStats();
}

async function getPlz() {
  if (plzTable) return plzTable;
  try {
    const r = await fetch("plz.json");
    if (!r.ok) throw new Error(r.status);
    plzTable = await r.json();
  } catch {
    return null;
  }
  return plzTable;
}

async function loadStats() {
  const n = ++statSeq;
  const [stats, pcs, plz] = await Promise.all([
    supabase.rpc("staff_stats", { p_days: days }),
    supabase.rpc("staff_postcodes", { p_days: days }),
    getPlz(),
  ]);
  if (n !== statSeq) return;
  const box = document.getElementById("statbox");
  if (!box) return;
  if (stats.error) return (box.innerHTML = `<p class="muted">Kein Zugriff: ${esc(stats.error.message)}</p>`);
  dropMap();
  geo = geoData(pcs.error ? null : pcs.data.postcodes, plz);
  box.innerHTML = renderStats(stats.data);
  if (openSecs.has("geo")) drawMap();
}

function toggleSec(name) {
  const el = document.querySelector(`.sec[data-sec="${name}"]`);
  if (!el) return;
  const on = !openSecs.has(name);
  on ? openSecs.add(name) : openSecs.delete(name);
  el.classList.toggle("open", on);
  el.querySelector(".head").setAttribute("aria-expanded", String(on));
  el.querySelector(".body").hidden = !on;
  if (on && name === "geo") map ? map.invalidateSize() : drawMap();
}

function sec(name, title, sum, body) {
  const on = openSecs.has(name);
  return `<div class="sec item${on ? " open" : ""}" data-sec="${name}">
    <button class="head" aria-expanded="${on}"><span class="grow"><span class="title">${title}</span><span class="sum">${sum}</span></span>${CHEV}</button>
    <div class="body"${on ? "" : " hidden"}>${body}</div>
  </div>`;
}

function bars(rows) {
  const total = (r) => r.parts.reduce((a, p) => a + p.n, 0);
  const max = Math.max(0, ...rows.map(total));
  return rows.map((r) => `
    <div class="brow"><span>${esc(r.label)}</span>
      <span class="track">${r.parts.map((p) => `<span class="fill${p.cls ? " " + p.cls : ""}" style="width:${max ? (p.n / max) * 100 : 0}%"></span>`).join("")}</span>
      <span>${num(total(r))}</span></div>`).join("");
}

const simple = (label, n) => ({ label, parts: [{ n }] });
const top = (arr) => arr.reduce((a, b) => (b.n > a.n ? b : a), arr[0]);

function km(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function geoData(postcodes, plz) {
  if (!postcodes) return { error: "PLZ-Daten nicht verfügbar" };
  if (!plz) return { error: "plz.json nicht gefunden" };
  const pts = [];
  let unknown = 0;
  for (const x of postcodes) {
    const c = plz[x.plz];
    if (c) pts.push({ plz: x.plz, n: x.guests, ll: c, d: km(SHOP, c) });
    else unknown += x.guests;
  }
  const total = pts.reduce((s, p) => s + p.n, 0);
  const share = (r) => (total ? Math.round((100 * pts.filter((p) => p.d < r).reduce((s, p) => s + p.n, 0)) / total) : 0);
  return { pts, total, unknown, share };
}

function renderStats(s) {
  const k = s.kpis;
  const nw = k.new_guests, ug = k.unique_guests;
  const guestNote = nw > 0 ? (nw === ug ? `alle ${num(nw)} neu` : `davon ${num(nw)} neu`) : "";

  let html = `<div class="hero"><div class="lab">Heute</div><span class="big">${num(k.visits_today)}</span><span class="unit">${k.visits_today === 1 ? "Besuch" : "Besuche"}</span></div>`;
  html += `<div class="switch">${[7, 30, 90].map((d) => `<button data-d="${d}" class="${d === days ? "on" : ""}">${d} Tage</button>`).join("")}</div>`;
  html += row("Besuche", k.visits_period);
  html += row("Gäste", ug, guestNote);
  html += row("Gratis-Burger eingelöst", k.redemptions);
  html += row("Kunden insgesamt", k.total_customers);

  const tg = s.top_guests;
  const regSum = tg.length
    ? `${esc(tg[0].name) || "(kein Name)"} vorne, ${besuche(tg[0].visits_period)}`
    : "Noch keine Besuche in diesem Zeitraum";
  const regBody = tg.length
    ? `<p class="sub">Besuche in den letzten ${days} Tagen</p>` + tg.map((g, i) => `
      <div class="lrow"><span class="rk">${i + 1}</span><span class="nm">${esc(g.name) || "(kein Name)"}</span><span>${num(g.visits_period)}</span></div>`).join("")
    : `<p class="muted">Noch keine Besuche in diesem Zeitraum.</p>`;

  const wd = s.by_weekday, hrs = s.by_hour;
  let whenSum = "Noch zu wenige Besuche für eine Aussage";
  if (k.visits_period >= MIN_VISITS_FOR_PEAK && wd.length && hrs.length) {
    const d = top(wd), h = top(hrs);
    whenSum = `Stärkster Tag ${WEEKDAYS_LONG[d.dow - 1]}, stärkste Stunde ${h.hour} bis ${h.hour + 1} Uhr`;
  }
  const a = hrs.findIndex((x) => x.n > 0);
  const b = hrs.findLastIndex((x) => x.n > 0);
  const whenBody = a === -1
    ? `<p class="muted">Noch keine Besuche in diesem Zeitraum.</p>`
    : `<p class="sub">Wochentage</p>${bars(wd.map((x) => simple(WEEKDAYS[x.dow - 1], x.n)))}
       <p class="sub">Uhrzeiten</p>${bars(hrs.slice(a, b + 1).map((x) => simple(`${x.hour} Uhr`, x.n)))}`;

  let geoSum, geoBody = "";
  if (geo.error) {
    geoSum = geo.error;
    geoBody = `<p class="muted">${geo.error}.</p>`;
  } else {
    geoSum = geo.total ? `${geo.share(2)} % wohnen unter 2 km entfernt` : "Noch keine Gäste mit Postleitzahl in diesem Zeitraum";
    geoBody = `<div id="map"></div>`;
    if (geo.total) {
      geoBody += `<p class="sub">Entfernung zum Laden</p>${RINGS_KM.map((r) => kv(`Unter ${r} km`, `${geo.share(r)} %`)).join("")}
        <p class="note">Grundlage: ${gaeste(geo.total)} mit Postleitzahl${geo.unknown ? `, dazu ${gaeste(geo.unknown)} mit unbekannter PLZ` : ""}.</p>`;
    }
  }
  geoBody += `<p class="sub">Häufigste Postleitzahlen</p>`;
  geoBody += s.postcodes.length
    ? s.postcodes.map((x) => kv(esc(x.postcode), num(x.n))).join("")
    : `<p class="muted">Noch keine Daten.</p>`;
  geoBody += `<p class="credit">Jeder Kreis ist eine Postleitzahl, je größer, desto mehr Gäste. Ringe bei ${RINGS_KM.join(", ")} km. Karte © OpenStreetMap-Mitwirkende, PLZ-Koordinaten von GeoNames (CC BY 4.0).</p>`;

  const weekBody = s.weekly.length
    ? `<div class="legend"><span><i></i>wiederkehrend</span><span><i class="nw"></i>neu</span></div>` +
      bars(s.weekly.map((w) => ({
        label: new Date(w.week_start).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }),
        parts: [{ n: w.returning }, { n: w.new, cls: "nw" }],
      })))
    : `<p class="muted">Noch keine Daten.</p>`;

  const q = s.quality;
  const qSum = q.bad_postcodes === 0
    ? "Alles in Ordnung"
    : `${num(q.bad_postcodes)} ${q.bad_postcodes === 1 ? "Kunde" : "Kunden"} ohne gültige PLZ`;
  const qBody =
    row("Sperrzeit-Treffer", q.cooldown_hits, "Erneuter Tap innerhalb der Sperrzeit, kein Punkt vergeben", "sm") +
    row("Seite neu geladen", q.reloads, "Gleicher Link erneut geöffnet, harmlos", "sm") +
    row("PLZ fehlt oder ungültig", q.bad_postcodes, "Alle Kunden", "sm");

  html += `<div class="secs">
    ${sec("regulars", "Stammgäste", regSum, regBody)}
    ${sec("when", "Wann Gäste kommen", whenSum, whenBody)}
    ${sec("geo", "Wo Gäste wohnen", geoSum, geoBody)}
    ${sec("weekly", "Neu und wiederkehrend", "Letzte 12 Wochen, unabhängig vom Zeitraum oben", weekBody)}
    ${sec("quality", "Datenqualität", qSum, qBody)}
  </div>`;

  html += `<p class="stand">Stand ${new Date(s.generated_at).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr, Kieler Ortszeit</p>`;
  return html;
}

function drawMap() {
  const el = document.getElementById("map");
  if (!el || !geo || geo.error) return;
  if (!window.L) { el.outerHTML = `<p class="muted">Kartenbibliothek nicht geladen.</p>`; return; }
  dropMap();
  map = L.map(el, { scrollWheelZoom: false, dragging: !L.Browser.mobile });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: "© OpenStreetMap",
  }).addTo(map);

  for (const r of RINGS_KM) {
    L.circle(SHOP, { radius: r * 1000, color: "#000", weight: 1, opacity: 0.5, dashArray: "4 6", fill: false, interactive: false }).addTo(map);
  }

  const max = Math.max(1, ...geo.pts.map((p) => p.n));
  for (const p of geo.pts) {
    L.circleMarker(p.ll, { radius: 6 + 16 * Math.sqrt(p.n / max), color: "#000", weight: 1, fillColor: "#000", fillOpacity: 0.55 })
      .bindTooltip(`PLZ ${esc(p.plz)}: ${gaeste(p.n)}, ${p.d.toFixed(1).replace(".", ",")} km entfernt`)
      .addTo(map);
  }

  L.circleMarker(SHOP, { radius: 7, color: "#000", weight: 3, fillColor: "#fff", fillOpacity: 1 })
    .bindTooltip("John's Burgers")
    .addTo(map);

  map.fitBounds(L.latLng(SHOP).toBounds(2 * 1000 * Math.max(...RINGS_KM)));
  requestAnimationFrame(() => map && map.invalidateSize());
}

logout.onclick = async () => { await supabase.auth.signOut(); showLogin(); };

const { data: { session } } = await supabase.auth.getSession();
session ? showApp() : showLogin();
</script>
