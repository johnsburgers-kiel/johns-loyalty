<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>John's Burgers · Stempelkarte</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font-family: "Helvetica Neue", Arial, sans-serif; background: #fff; color: #000; }
  header { background: #000; color: #fff; text-align: center; padding: 14px 16px; }
  .brand { margin: 0; font-family: "Times New Roman", Georgia, serif; font-weight: 700; font-size: 1.5rem; letter-spacing: .05em; text-transform: uppercase; }
  .brand span { display: block; margin-top: 4px; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: .7rem; letter-spacing: .26em; color: #bbb; }
  .rule { height: 3px; background: #000; margin-top: 4px; }
  main { flex: 1; width: 100%; max-width: 420px; margin: 0 auto; padding: 24px 20px 8px; text-align: center; }
  .logo { display: block; width: 120px; height: 120px; object-fit: contain; margin: 0 auto 12px; mix-blend-mode: multiply; }
  p { line-height: 1.5; }
  input[type=email], input[type=text] { width: 100%; font-family: inherit; font-size: 1.05rem; padding: 12px 14px; margin-bottom: 10px; border: 2px solid #000; border-radius: 0; background: #fff; color: #000; }
  input:focus { outline: 2px solid #000; outline-offset: 2px; }
  button { width: 100%; margin-top: 8px; font-family: inherit; font-size: 1rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 15px; border: 2px solid #000; border-radius: 0; background: #000; color: #fff; cursor: pointer; }
  button:active { background: #fff; color: #000; }
  label.consent { display: flex; gap: 10px; align-items: flex-start; font-size: .85rem; text-align: left; margin: 6px 0 4px; }
  label.consent input { flex: none; width: 18px; height: 18px; margin-top: 2px; accent-color: #000; }
  .big { margin: 10px 0; padding: 10px 0; border-top: 3px solid #000; border-bottom: 3px solid #000; font-family: "Times New Roman", Georgia, serif; font-size: 2.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .muted { color: #6b6b6b; font-size: .9rem; }
  a { color: #000; text-decoration: underline; }
  .liberty { display: block; width: 100%; max-width: 420px; margin: 16px auto 0; mix-blend-mode: multiply; }
</style>
</head>
<body>
<header>
  <h1 class="brand">John's Burgers<span>STEMPELKARTE</span></h1>
</header>
<div class="rule"></div>
<main>
  <img class="logo" src="logo-black.png" alt="John's Burgers" onerror="this.style.display='none'">
  <div id="view"></div>
</main>
<img class="liberty" src="liberty.png" alt="" onerror="this.style.display='none'">
<script>
const ENDPOINT = "https://zhqxjdlqxgjzqamququu.supabase.co/functions/v1/checkin";
const REWARD = "Gratis-Burger";
const NAME = /^[\p{L}\p{M}\p{N} .'-]{1,60}$/u;
const q = new URLSearchParams(location.search);
const tap = { uid: q.get("uid"), ctr: q.get("ctr"), cmac: q.get("cmac") };
const view = document.getElementById("view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const time = (iso) => new Date(iso).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

function status(r) {
  const available = Math.floor(r.points / r.reward_cost);
  if (available > 1) return `<p>🎉 ${available} ${REWARD} warten auf dich – sag beim Bestellen Bescheid.</p>`;
  if (available === 1) return `<p>🎉 Ein ${REWARD} wartet auf dich – sag beim Bestellen Bescheid.</p>`;
  const left = Math.ceil((r.reward_cost - r.points) / r.points_per_visit);
  return `<p class="muted">Noch ${left} ${left === 1 ? "Besuch" : "Besuche"} bis zum ${REWARD}.</p>`;
}

const messages = {
  cooldown: (r) => `<p>Du warst gerade schon hier 🙂</p><p class="muted">Nächster Punkt ab ${time(r.retry_at)} Uhr.</p>${status(r)}`,
  stale_counter: () => `<p>Dieser Link ist schon verbraucht.</p><p class="muted">Bitte das Handy noch einmal an den Burger halten.</p>`,
  bad_mac: () => `<p>Ungültiger Tag.</p>`,
  unknown_tag: () => `<p>Ungültiger Tag.</p>`,
};

function showForm() {
  view.innerHTML = `
    <p>Einmal eintragen, ab dann geht's automatisch.</p>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="deine@email.de">
    <input id="name" type="text" autocomplete="name" placeholder="Name">
    <input id="postcode" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="PLZ">
    <label class="consent"><input id="consent" type="checkbox"> Ich bin einverstanden, dass meine Angaben für das Bonusprogramm gespeichert werden. <a href="datenschutz.html">Datenschutz</a></label>
    <button id="go">Punkt sichern</button>`;
  document.getElementById("go").onclick = () => {
    const email = document.getElementById("email").value.trim();
    const name = document.getElementById("name").value.trim();
    const postcode = document.getElementById("postcode").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return alert("Bitte eine gültige E-Mail eingeben.");
    if (!NAME.test(name)) return alert("Bitte einen Namen eingeben (Buchstaben, Leerzeichen, Bindestrich).");
    if (!/^\d{5}$/.test(postcode)) return alert("Bitte deine PLZ eingeben (5 Ziffern).");
    if (!document.getElementById("consent").checked) return alert("Bitte der Speicherung zustimmen.");
    localStorage.setItem("email", email);
    claim({ email, name, postcode });
  };
}

async function claim(who) {
  view.innerHTML = `<p>Einen Moment …</p>`;
  let r;
  try {
    const res = await fetch(ENDPOINT, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...tap, ...who }) });
    r = await res.json();
  } catch {
    view.innerHTML = `<p>Keine Verbindung – bitte das Handy gleich noch einmal an den Burger halten.</p>`;
    return;
  }
  history.replaceState(null, "", location.pathname);
  view.innerHTML = r.ok
    ? `<p>Danke${r.name ? ", " + esc(r.name.split(" ")[0]) : ""}!</p><div class="big">Besuch Nr. ${r.visits}</div>${status(r)}`
    : (messages[r.reason] || (() => `<p>Da ist etwas schiefgelaufen.</p>`))(r);
  view.innerHTML += `<p class="muted">${esc(who.email)} · <a href="#" id="change">nicht du?</a></p>`;
  document.getElementById("change").onclick = (e) => {
    e.preventDefault();
    localStorage.removeItem("email");
    view.innerHTML = `<p>E-Mail vergessen. Bitte noch einmal an den Burger halten und neu eintragen.</p>`;
  };
}

if (!tap.uid || !tap.ctr || !tap.cmac) {
  view.innerHTML = `<p>Halte dein Handy an den Burger auf der Theke – dann gibt's Punkte.</p>`;
} else if (localStorage.getItem("email")) {
  claim({ email: localStorage.getItem("email") });
} else {
  showForm();
}
</script>
</body>
</html>
